<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>DIP — Digital Information Delivery Platform</title>
    <script>
      // Runs before the first paint, so a dark-theme user never sees a white flash
      // while the bundle loads. Deliberately duplicates the small resolution rule in
      // src/shared/theme/theme.ts — React cannot run early enough to do this, and the
      // storage key is asserted against that module in theme.test.ts.
      (function () {
        try {
          var stored = window.localStorage.getItem('dip.theme')
          var preference = stored === 'light' || stored === 'dark' ? stored : 'system'
          var dark = preference === 'dark'
            || (preference === 'system'
              && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (error) {
          /* private mode, or storage blocked: fall through to the light default */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
